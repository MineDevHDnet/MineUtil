name: Build MineUtil

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build
        run: /tmp/gradle-2.14.1/bin/gradle --no-daemon --stacktrace clean build

      - name: Verify addon jar
        run: |
          JAR=build/libs/MineUtil-1.4.0.jar
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" addon.json > /tmp/addon.json
          grep -q '"mainClass"' /tmp/addon.json
          if unzip -l "$JAR" | grep -q 'net/labymod/'; then
            echo 'LabyMod API classes were accidentally packaged.' >&2
            exit 1
          fi
          sha256sum "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: MineUtil-1.4.0-LabyMod3-1.8.9
          path: build/libs/MineUtil-1.4.0.jar
          if-no-files-found: error
