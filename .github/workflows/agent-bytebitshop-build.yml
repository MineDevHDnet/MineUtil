name: Temporary ByteBitShop Build
on:
  push:
    branches: [agent-bytebitshop-build]
permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[jar-result]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore 1.0.1 source
        run: |
          cat .bytebitshop-build/chunk*.b64 | tr -d '\n\r' | base64 -d > /tmp/ByteBitShop-1.0.1-source.tar.xz
          echo '29076ac0fdbc6cfb377b7b1877c6c145aa6eb7c059a3d42074c437ca9d8b2e67  /tmp/ByteBitShop-1.0.1-source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/bytebitshop
          tar -xJf /tmp/ByteBitShop-1.0.1-source.tar.xz -C /tmp/bytebitshop

      - name: Apply 1.0.2 patch
        run: |
          echo '' | base64 -d | xz -dc > /tmp/bytebitshop-1.0.2.patch
          patch -p1 -d /tmp/bytebitshop < /tmp/bytebitshop-1.0.2.patch
          grep -q "paymentDelayMs = 2500" /tmp/bytebitshop/src/main/java/net/minedevhd/bytebitshop/ByteBitConfig.java
          grep -q "GUI_MAX_W = 760" /tmp/bytebitshop/src/main/java/net/minedevhd/bytebitshop/gui/ShopGui.java
          grep -q "VERSION = \"1.0.2\"" /tmp/bytebitshop/src/main/java/net/minedevhd/bytebitshop/ByteBitShopCore.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build
        working-directory: /tmp/bytebitshop
        run: /tmp/gradle-2.14.1/bin/gradle --no-daemon --stacktrace clean build

      - name: Verify and publish JAR
        run: |
          JAR=/tmp/bytebitshop/build/libs/ByteBitShop-1.0.2.jar
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'net/minedevhd/bytebitshop/ByteBitShopCore.class'
          cp "$JAR" ByteBitShop-1.0.2.jar
          sha256sum ByteBitShop-1.0.2.jar | tee ByteBitShop-1.0.2.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f ByteBitShop-1.0.1.jar ByteBitShop-1.0.1.sha256 || true
          git add ByteBitShop-1.0.2.jar ByteBitShop-1.0.2.sha256
          git commit -m '[jar-result] ByteBitShop 1.0.2'
          git push origin HEAD:agent-bytebitshop-build
