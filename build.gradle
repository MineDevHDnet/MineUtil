buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.4.0'
group = 'net.minedevhd.mineutil'
archivesBaseName = 'MineUtil'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

def labyApiFile = file("${buildDir}/dependencies/lm_api_mc1.8.9.jar")

task downloadLabyModApi {
    outputs.file labyApiFile
    doLast {
        if (labyApiFile.exists()) {
            return
        }

        labyApiFile.parentFile.mkdirs()
        def connection = new URL('https://dl.labymod.net/latest/api/lm_api_mc1.8.9.jar').openConnection()
        connection.setConnectTimeout(10000)
        connection.setReadTimeout(30000)
        connection.setRequestProperty('User-Agent', 'MineUtil-Gradle/1.4.0')

        labyApiFile.withOutputStream { output ->
            connection.getInputStream().withCloseable { input ->
                output << input
            }
        }
    }
}

dependencies {
    compile files(labyApiFile)
}

compileJava.dependsOn downloadLabyModApi

jar {
    baseName = 'MineUtil'
    version = project.version
    exclude 'net/labymod/**'
    manifest {
        attributes(
            'Implementation-Title': 'MineUtil',
            'Implementation-Version': version,
            'Implementation-Vendor': 'MineDev_HD'
        )
    }
}

reobf {
    jar { useNotchSrg() }
}
