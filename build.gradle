buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.4.0'
group = 'net.minedevhd.mineutil'
archivesBaseName = 'MineUtil'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}

def labyApiFile = file("${buildDir}/dependencies/lm_api_mc1.8.9.jar")

task downloadLabyModApi {
    outputs.file labyApiFile
    doLast {
        labyApiFile.parentFile.mkdirs()
        if (!labyApiFile.exists()) {
            ant.get(
                src: 'https://dl.labymod.net/latest/api/lm_api_mc1.8.9.jar',
                dest: labyApiFile,
                verbose: true,
                usetimestamp: true
            )
        }
    }
}

dependencies {
    compile files(labyApiFile)
}

compileJava.dependsOn downloadLabyModApi

jar {
    baseName = 'MineUtil'
    version = project.version
    exclude 'net/labymod/**'
    manifest {
        attributes(
            'Implementation-Title': 'MineUtil',
            'Implementation-Version': version,
            'Implementation-Vendor': 'MineDev_HD'
        )
    }
}

reobf {
    jar { useNotchSrg() }
}
